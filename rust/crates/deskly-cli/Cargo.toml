[package]
name = "deskly-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "deskly"
path = "src/main.rs"

[dependencies]
deskly-types = { path = "../deskly-types" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "time"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
url = "=2.5.8"
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
