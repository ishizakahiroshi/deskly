[workspace]
members = ["crates/deskly-types", "crates/deskly-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regress = "=0.12.0"
prettyplease = "=0.2.37"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }
schemars = "=0.8.22"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
typify = { version = "=0.8.0", default-features = false }
uuid = { version = "=1.23.0", default-features = false }
