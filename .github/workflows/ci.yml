name: ci

# PR ごとにテストと型チェックを走らせる。
# - python: 既存の Python 版（pytest・ruff・mypy）
# - worker-node: deploy/cloudflare-personal の node テスト
# - core: TypeScript の中核（core/package.json ができたら走る）
# - rust: Rust の CLI と MCP（rust/Cargo.toml ができたら走る）
# core と rust は、フォルダができるまで何もせず成功する。
# このファイルは手元のセッションだけが変える（dot の PR で変えない）。

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: pytest
        run: python -m pytest -q
      - name: ruff
        run: python -m ruff check deskly tests
      - name: mypy
        run: python -m mypy deskly

  worker-node:
    name: worker (node test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node test
        run: node --test "deploy/cloudflare-personal/tests/*.test.cjs"

  core:
    name: core (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect
        id: detect
        run: |
          if [ -f core/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "core/package.json がまだ無いので何もしない"
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: pnpm run typecheck
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: pnpm run test

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect
        id: detect
        run: |
          if [ -f rust/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "rust/Cargo.toml がまだ無いので何もしない"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.present == 'true'
        with:
          workspaces: rust
      - name: fmt
        if: steps.detect.outputs.present == 'true'
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: clippy
        if: steps.detect.outputs.present == 'true'
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        if: steps.detect.outputs.present == 'true'
        working-directory: rust
        run: cargo test --all
